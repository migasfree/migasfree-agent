name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/migasfree/migasfree-client.git@REST-API
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check migasfree_agent/

    - name: Check formatting with Ruff
      run: ruff format --check migasfree_agent/

    - name: Type check with Mypy
      run: mypy migasfree_agent/

  test:
    needs: lint-and-type-check
    strategy:
      matrix:
        python-version: ["3.8", "3.10", "3.12"]
      fail-fast: false

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/migasfree/migasfree-client.git@REST-API
        pip install -e ".[dev]"

    - name: Run Tests
      run: pytest tests/

  build-linux:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm

    - name: Build Packages (DEB & RPM)
      run: |
        chmod +x build.sh
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Building version $VERSION"
          ./build.sh $VERSION
        else
          ./build.sh
        fi

    - name: Upload Linux Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages-linux
        path: dist/

  build-windows:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v6

    - name: Build Windows Package (ZIP)
      shell: pwsh
      run: |
        if ($env:GITHUB_REF -like "refs/tags/*") {
          $VERSION = $env:GITHUB_REF.Replace('refs/tags/', '')
          echo "Building version $VERSION"
          .\build.bat $VERSION
        } else {
          .\build.bat
        }

    - name: Upload Windows Artifacts
      uses: actions/upload-artifact@v7
      with:
        name: packages-windows
        path: dist/*.zip

  release:
    name: Create GitHub Release
    needs: [build-linux, build-windows]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - uses: actions/checkout@v6

    - name: Download Linux Artifacts
      uses: actions/download-artifact@v7
      with:
        name: packages-linux
        path: release-assets/

    - name: Download Windows Artifacts
      uses: actions/download-artifact@v7
      with:
        name: packages-windows
        path: release-assets/

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          release-assets/*.deb
          release-assets/*.rpm
          release-assets/*.zip
        draft: false
        prerelease: false
        generate_release_notes: true
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
