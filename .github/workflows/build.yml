name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
    tags:
      - '*'
  pull_request:
    branches: [ main ]

jobs:
  lint-and-type-check:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python 3.12
      uses: actions/setup-python@v6
      with:
        python-version: "3.12"
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/migasfree/migasfree-client.git@REST-API
        pip install -e ".[dev]"

    - name: Lint with Ruff
      run: ruff check migasfree_agent/

    - name: Check formatting with Ruff
      run: ruff format --check migasfree_agent/

    - name: Type check with Mypy
      run: mypy migasfree_agent/

  test:
    needs: lint-and-type-check
    strategy:
      matrix:
        python-version: ["3.6", "3.8", "3.10", "3.12"]
        include:
          - python-version: "3.6"
            os: ubuntu-20.04
          - python-version: "3.8"
            os: ubuntu-latest
          - python-version: "3.10"
            os: ubuntu-latest
          - python-version: "3.12"
            os: ubuntu-latest
      fail-fast: false

    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v6
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install git+https://github.com/migasfree/migasfree-client.git@REST-API
        pip install -e ".[dev]"

    - name: Run Tests
      run: pytest tests/

  build:
    needs: test
    if: startsWith(github.ref, 'refs/tags/') || contains(github.event.head_commit.message, '[build]')
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Install build tools
      run: |
        sudo apt-get update
        sudo apt-get install -y rpm

    - name: Build Package
      run: |
        chmod +x build.sh
        if [[ $GITHUB_REF == refs/tags/* ]]; then
          VERSION=${GITHUB_REF#refs/tags/}
          echo "Building version $VERSION"
          ./build.sh $VERSION
        else
          ./build.sh
        fi

    - name: Upload Artifacts
      uses: actions/upload-artifact@v6
      with:
        name: packages
        path: dist/
