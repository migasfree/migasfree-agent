repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    # Ruff version
    rev: v0.1.15
    hooks:
      # Run the linter.
      - id: ruff
        args: [--fix]
      # Run the formatter.
      - id: ruff-format

  - repo: local
    hooks:
      # Run mypy locally to leverage installed virtual environment dependencies.
      - id: mypy
        name: mypy
        entry: .venv/bin/mypy migasfree_agent/
        language: system
        types: [python]
        pass_filenames: false
        always_run: true
